name: Frontend CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "server/**"
      - "k8s/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "server/**"
      - "k8s/**"
      - "*.md"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (vite build)
        run: npm run build
