apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mn3j-group
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # Image publiée par .github/workflows/backend-ci.yml sur ghcr.io.
          image: ghcr.io/maeva6/mn3j-group-api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mn3j-group
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 4000
