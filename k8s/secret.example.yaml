# Modèle : copier en "secret.yaml" (ignoré par git, voir k8s/.gitignore),
# remplacer les valeurs, puis `kubectl apply -f k8s/secret.yaml`.
# ⚠️ Ne jamais committer le fichier "secret.yaml" rempli.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: mn3j-group
type: Opaque
stringData:
  DATABASE_URL: "postgresql://mn3j:CHANGE_ME@postgres:5432/mn3j?schema=public"
  POSTGRES_PASSWORD: "CHANGE_ME"
  JWT_SECRET: "change-me-before-deploy"
  ADMIN_EMAIL: "admin@mn3jgroup.com"
  ADMIN_PASSWORD: "change-me-before-deploy"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
