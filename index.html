<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>MN3J-GROUP, Piscines haut de gamme, décoration, BTP & formation aquatique</title>

    <!--
      Balises meta par défaut, communes à tout le site. Le composant
      src/components/Seo.jsx met à jour le <title> et la description à
      chaque page pour les moteurs qui exécutent le JS (Google), mais les
      robots de partage social (Facebook, WhatsApp, LinkedIn…) ne lisent
      que ce qui est écrit ici en dur : sans rendu serveur, l'aperçu de
      partage restera donc identique sur toutes les pages.
    -->
    <meta name="description" content="MN3J-GROUP conçoit vos piscines haut de gamme, vos aménagements et vos chantiers d'exception à Douala : décoration, BTP et formation aquatique avec un savoir-faire vérifié." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1B3A63" />

    <!--
      ⚠️ TODO domaine définitif : les URLs ci-dessous (og:url, og:image,
      twitter:image) pointent vers le domaine Vercel provisoire
      (mn-3-j-group-website.vercel.app). Une fois le nom de domaine dédié
      branché, remplacez-les par le nouveau domaine — sinon les aperçus de
      partage (Facebook, WhatsApp, LinkedIn…) continueront de pointer vers
      l'ancienne URL. Penser aussi à scripts/generate-sitemap.js (SITE_URL)
      et public/robots.txt (ligne Sitemap:), qui ont le même domaine en dur.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MN3J-GROUP" />
    <meta property="og:url" content="https://mn-3-j-group-website.vercel.app/" />
    <meta property="og:title" content="MN3J-GROUP, Piscines haut de gamme, décoration, BTP & formation aquatique" />
    <meta property="og:description" content="Piscines haut de gamme, décoration, BTP et formation aquatique. Un savoir-faire vérifié, du premier plan à la dernière finition." />
    <meta property="og:image" content="https://mn-3-j-group-website.vercel.app/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MN3J-GROUP, Piscines haut de gamme, décoration, BTP & formation aquatique" />
    <meta name="twitter:description" content="Piscines haut de gamme, décoration, BTP et formation aquatique. Un savoir-faire vérifié, du premier plan à la dernière finition." />
    <meta name="twitter:image" content="https://mn-3-j-group-website.vercel.app/og-image.jpg" />
  </head>
  <body>
    <div id="root">
      <!-- Affiché tant que le bundle React ne s'est pas monté (connexions
           lentes). main.jsx retire ce nœud dès le premier rendu, puisque
           React remplace le contenu de #root au montage. -->
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff">
        <div style="width:36px;height:36px;border-radius:9999px;border:3px solid #E4EAF5;border-top-color:#1B3A63;animation:mn3j-spin .8s linear infinite"></div>
      </div>
      <style>@keyframes mn3j-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
